name: Medidor de força de Senhas
on:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        id: deps
        working-directory: app
        run: npm install

      - name: Lint NPM
        id: lint
        working-directory: app
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        id: deps
        working-directory: app
        run: npm install

      - name: Testes de cobertura
        id: tests
        working-directory: app
        run: |
          npm test >> "$GITHUB_OUTPUT"
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
  build:
    needs: test
    permissions:
      contents: read
      packages: write
    if: ${{ needs.test.outputs.coverage >= 80 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Build
        id: docker_login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        id: build_push
        run: |
          repo_lc=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo_lc}/api:${GITHUB_SHA}"
          docker build \
            --build-arg GH_PACKAGES_TOKEN \
            -t "$image" \
            app
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
    outputs:
      image: ${{ steps.docker_login.outputs.image }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print image
        run: echo "Deploying ${{ needs.build.outputs.image }}"